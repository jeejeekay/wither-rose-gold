plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    gametest
}

// Rose Gold Equipment, from a jar in libs/ (see rge_dir in gradle.properties).
// WRG's code doesn't use RGE's classes - only its item names in recipes - so it's only needed
// when the game actually runs (runClient, runServer, GameTests), not to compile.
def rgeJars = fileTree(dir: file(project.rge_dir), include: 'rosegoldequipment-*.jar', exclude: ['*-sources.jar', '*-javadoc.jar'])

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gametest   // must come after "version"

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    gametestImplementation sourceSets.main.output
    localRuntime rgeJars
}

// Say so clearly instead of failing later with "mod rosegoldequipment is missing".
def rgeMissing = "Rose Gold Equipment jar not found in '${project.rge_dir}'. Copy rosegoldequipment-<version>.jar (NeoForge, ${project.minecraft_version}) there first.".toString()
tasks.matching { it.name.startsWith('run') }.configureEach {
    doFirst {
        if (rgeJars.isEmpty()) throw new GradleException(rgeMissing)
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            rge_version_range      : rge_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
