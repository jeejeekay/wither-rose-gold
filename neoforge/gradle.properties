# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.10
parchment_mappings_version=2025.10.12

## Environment Properties
minecraft_version=1.21.11
minecraft_version_range=[1.21.11,1.22)
neo_version=21.11.48
neo_version_range=[21.11.42,)
loader_version_range=[4,)

## Mod Properties
mod_id=witherrosegold
mod_name=Wither Rose Gold
mod_license=MIT
mod_version=1.0.0
mod_group_id=net.igobyjake.witherrosegold
mod_authors=igobyjake
mod_description=Upgrades Rose Gold Equipment's tools and armor to wither rose gold. Requires Rose Gold Equipment.

## Rose Gold Equipment (required dependency)
# Which RGE versions this works with.
rge_version_range=[1.10.0,)
# Where to find the RGE jar for runClient / runServer / GameTests. Put rosegoldequipment-<version>.jar
# (the NeoForge one, same Minecraft version) in this folder - build-all.ps1 and CI do it for you.
rge_dir=libs
