# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=net.igobyjake.witherrosegold
archives_base_name=witherrosegold

# Fabric API
fabric_version=0.165.2+26.3

# Rose Gold Equipment (required dependency): where to find its jar for runClient / runServer / GameTests.
# Put rosegoldequipment-<version>.jar (the Fabric one, same Minecraft version) in this folder -
# build-all.ps1 and CI do it for you.
rge_dir=libs

# Optional in-game settings screen (only needed to compile; players install them if they want the screen)
# Mod Menu: https://modrinth.com/mod/modmenu   Cloth Config: https://modrinth.com/mod/cloth-config
modmenu_version=21.0.0
cloth_config_version=26.3.159+fabric
